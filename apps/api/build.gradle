buildscript {
	dependencies {
		// flywayMigrate 태스크가 PostgreSQL에 접속하기 위한 의존성
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
		classpath 'org.postgresql:postgresql:42.7.14'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '12.4.0'
	id 'org.jooq.jooq-codegen-gradle' version '3.21.9'
}

group = 'com.aishop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 로컬 개발 DB (docker-compose.yml). 환경변수로 덮어쓸 수 있다.
def dbUrl = System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5433/aishop'
def dbUser = System.getenv('DB_USERNAME') ?: 'aishop'
def dbPassword = System.getenv('DB_PASSWORD') ?: 'aishop'

// jOOQ 생성 코드는 저장소에 커밋한다. 스키마를 바꿨을 때만 ./gradlew jooqCodegen 실행
def jooqGeneratedDir = 'src/generated/jooq'

sourceSets {
	main {
		java {
			srcDir jooqGeneratedDir
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.jooq:jooq-postgres-extensions'
	// 송장 엑셀 내려받기·올리기
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	runtimeOnly 'org.postgresql:postgresql'

	jooqCodegen 'org.postgresql:postgresql:42.7.14'
	jooqCodegen 'org.jooq:jooq-postgres-extensions:3.21.9'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

flyway {
	url = dbUrl
	user = dbUser
	password = dbPassword
	locations = ['filesystem:src/main/resources/db/migration']
	cleanDisabled = true
}

jooq {
	configuration {
		jdbc {
			driver = 'org.postgresql.Driver'
			url = dbUrl
			user = dbUser
			password = dbPassword
		}
		generator {
			database {
				name = 'org.jooq.meta.postgres.PostgresDatabase'
				inputSchema = 'public'
				excludes = 'flyway_schema_history'
				includeRoutines = false
			}
			generate {
				javaTimeTypes = true
				records = true
				pojos = false
				daos = false
				fluentSetters = true
			}
			target {
				packageName = 'com.aishop.api.jooq'
				directory = jooqGeneratedDir
			}
		}
	}
}

// 스키마 변경 → DB에 적용 → 코드 생성 순서 보장
tasks.named('jooqCodegen') {
	dependsOn tasks.named('flywayMigrate')
	inputs.files(fileTree('src/main/resources/db/migration'))
}

tasks.named('test') {
	useJUnitPlatform()
}

// 같은 명령에서 함께 실행할 때(./gradlew jooqCodegen build) 생성이 먼저 끝나도록 순서만 지정
tasks.named('compileJava') {
	mustRunAfter tasks.named('jooqCodegen')
}
