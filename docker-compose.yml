# 로컬 개발용 DB/캐시. 실행: docker compose up -d
# PC에 이미 PostgreSQL(5432)이 있어서 5433 포트를 사용한다.
services:
  postgres:
    image: postgres:18
    container_name: aishop-postgres
    environment:
      POSTGRES_DB: aishop
      POSTGRES_USER: aishop
      POSTGRES_PASSWORD: aishop
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aishop -d aishop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: aishop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
